<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- outer cream -->
  <rect width="1024" height="1024" fill="#F5F0E8"/>
  <!-- circle rim -->
  <circle cx="512" cy="512" r="460" fill="#1C1917" stroke="url(#rim)" stroke-width="36"/>
  <!-- SM initials -->
  <text x="512" y="280" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="200" fill="url(#smGrad)" filter="url(#soft)">SM</text>
  <!-- crate body -->
  <g filter="url(#soft)">
    <rect x="280" y="420" width="464" height="320" rx="18" fill="#A16207"/>
    <rect x="296" y="436" width="432" height="288" rx="12" fill="#B45309"/>
    <!-- horizontal slats -->
    <rect x="296" y="500" width="432" height="18" fill="#78350F" opacity="0.55"/>
    <rect x="296" y="580" width="432" height="18" fill="#78350F" opacity="0.55"/>
    <rect x="296" y="660" width="432" height="18" fill="#78350F" opacity="0.45"/>
    <!-- vertical -->
    <rect x="400" y="436" width="16" height="288" fill="#78350F" opacity="0.4"/>
    <rect x="608" y="436" width="16" height="288" fill="#78350F" opacity="0.4"/>
    <!-- bottles simplified -->
    <ellipse cx="360" cy="470" rx="28" ry="12" fill="#F59E0B"/>
    <rect x="340" y="470" width="40" height="90" rx="8" fill="#FBBF24"/>
    <ellipse cx="450" cy="465" rx="26" ry="11" fill="#292524"/>
    <rect x="432" y="465" width="36" height="95" rx="8" fill="#44403C"/>
    <ellipse cx="540" cy="468" rx="26" ry="11" fill="#14532D"/>
    <rect x="522" y="468" width="36" height="92" rx="8" fill="#166534"/>
    <ellipse cx="630" cy="470" rx="26" ry="11" fill="#7F1D1D"/>
    <rect x="612" y="470" width="36" height="90" rx="8" fill="#991B1B"/>
    <ellipse cx="720" cy="475" rx="24" ry="10" fill="#1C1917"/>
    <rect x="704" y="475" width="32" height="85" rx="7" fill="#292524"/>
  </g>
  <!-- small checklist badge -->
  <rect x="620" y="340" width="140" height="100" rx="12" fill="#0C0A09" stroke="#F59E0B" stroke-width="3" opacity="0.92"/>
  <circle cx="650" cy="370" r="8" fill="none" stroke="#67E8F9" stroke-width="3"/>
  <path d="M646 370 l3 4 8-8" fill="none" stroke="#67E8F9" stroke-width="2.5"/>
  <circle cx="650" cy="400" r="8" fill="none" stroke="#67E8F9" stroke-width="3"/>
  <path d="M646 400 l3 4 8-8" fill="none" stroke="#67E8F9" stroke-width="2.5"/>
  <line x1="670" y1="370" x2="740" y2="370" stroke="#67E8F9" stroke-width="3" opacity="0.6"/>
  <line x1="670" y1="400" x2="730" y2="400" stroke="#67E8F9" stroke-width="3" opacity="0.5"/>
</svg>
